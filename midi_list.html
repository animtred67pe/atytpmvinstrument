<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Midi Playlist - YTPMV Cartoon Midi</title>
		<style>
			body {
				overflow: hidden;
				background-color: #222;
				color: #fff;
				font-family: monospace;
			}
			a {
				color: #fff;
			}
			#scenes {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
			}
		</style>
	</head>
	<body>
		<canvas width="640" height="360" id="scenes"></canvas>
		<div style="z-index: 9999; position: absolute; top: 5px; left: 5px;">
			<a href="./">back</a>
			<a id="loadmidifile" href="#">Load Mids</a>
			<a id="midireset" href="#">Reset</a>
			<label>Zoom: </label>
			<input type="range" name="" value="1" min="0.5" step="0.5" max="3.0" id="vcbb" style="width: 180px;">
			<br>
			<a id="midisongprev" href="#">Prev mid</a>
			<a id="midisongnext" href="#">Next mid</a>
			<a id="midiplaypause" href="#">Play/Pause</a>
			<a id="midiplaylishshowhide" href="#">Playlist Show/Hide</a>
		</div>
		<script src="animtredinstruments.js"></script>
		<script>
			(function() {
				var player = new AnimTredInstruments.Player();
				window.player = player;
				var songsDatas = [];
				var loadmidifile = document.getElementById('loadmidifile');
				var midireset = document.getElementById('midireset');
				var midisongnext = document.getElementById('midisongnext');
				var midisongprev = document.getElementById('midisongprev');
				var midiplaypause = document.getElementById('midiplaypause');
				var midiplaylishshowhide = document.getElementById('midiplaylishshowhide');
				var cansvas = document.getElementById('scenes');
				var ggdf_loaded = "";
				var vcbb = document.getElementById('vcbb');
				var ctx = cansvas.getContext("2d");
				var xoom = 1;
				var current_song = -1;
				var select_song = 0;
				var vassf2 = -46;
				var vassf3 = [0, 0];
				var vassf4 = 0;
				var vassf5 = 0;
				var hHS = 0;
				var selSa = false;
				var isRunning = false;
				var GSGSG = [];
				var GSGSG2 = [];
				var gfgfhh = {};
				var fHH = {};
				var soundsCount = {
					"My Little Pony": 0,
					"Peppa Pig": 0,
				}
				var SOUNDBANK_FILES = {};
				for (var soundbankTitle in AnimTredInstruments.SOUNDBANKS) {
					var st = AnimTredInstruments.SOUNDBANKS[soundbankTitle];
					for (var filePath in st) {
						fHH[filePath] = soundbankTitle;
					}
				}
				function reset() {
					selSa = true;
					gfgfhh = {};
					GSGSG = [];
					GSGSG2 = [];
					for (var i in AnimTredInstruments.SOUNDBANKS) {
						gfgfhh[i] = {};
					}
					soundsCount = {
						"My Little Pony": 0,
						"Peppa Pig": 0
					}
					var fsd = 0;
					for (var fdssf2 in gfgfhh) {
						GSGSG2.push({
							name: fdssf2,
							index: fsd,
							scoreRender: 0,
							y: 35
						});
						GSGSG.push({
							name: fdssf2,
							index: fsd,
							score: 0,
							scoreRender: 0
						});
						fsd++;
					}
					selSa = false;
					player.cleanup();
					select_song = 0;
					current_song = -1;
					vassf2 = -46;
					vassf3 = [0, 0];
					vassf4 = 0;
					hHS = 24;
				}
				player.onplaynote = function (e) {
					if (e.channel == 9) {
						var span = AnimTredInstruments.getDrumSpan(e.program, e.pitch);
						if (!span) return;
						addScS(fHH[span[0]]);
					} else {
						var span = AnimTredInstruments.getInstrumentSpan(e.program, e.pitch);
						if (!span) return;
						addScS(fHH[span[1]]);
					}
				}
				function addScS(na) {
					if (na in gfgfhh) {
						for (var i = 0; i < GSGSG.length; i++) {
							if (GSGSG[i].name == na) {
								if (na.indexOf("My little pony") >= 0 || na.indexOf("My Little Pony") >= 0 || na.indexOf("MLP") >= 0 || na.indexOf("Friendship") >= 0 || na.indexOf("friendship") >= 0 || na.indexOf("Sweeping") >= 0) soundsCount["My Little Pony"]++;
								if (na.indexOf("Peppa Pig") >= 0) soundsCount["Peppa Pig"]++;
								GSGSG[i].score++;
								if (i !== 0) {
									var fd = i - 1;
									while (true) {
										if (GSGSG[i].score <= GSGSG[fd].score) {
											fd++;
											break;
										}
										fd--;
										if (fd < 0) {
											fd++;
											break;
										}
									}
									if (i !== fd) {
										var hf1 = GSGSG[i];
										var hf2 = GSGSG[fd];
										GSGSG[i] = hf2;
										GSGSG[fd] = hf1;	
									}
								}
								break;
							}
						}
					}
				}
				midireset.onclick = function() {
					reset();
				}
				function resizess() {
					cansvas.width = xoom * 640;
					cansvas.height = xoom * 360;
				}
				var channelColor = [
					"#2f5fed", // 0
					"#ed752f", // 1
					"#2fed5f", // 2
					"#ed2f78", // 3
					"#31f7f7", // 4
					"#dd31f7", // 5
					"#94f731", // 6
					"#4931f7", // 7
					"#f7c631", // 8
					"#31aef7", // 9
					"#f73131", // 10
					"#31f7ab", // 11
					"#f731c6", // 12
					"#4cf731", // 13
					"#9431f7", // 14
					"#e2fa32", // 15
				];
				function reste() {
					gfgfhh = {};
					GSGSG = [];
					GSGSG2 = [];
					for (var i in AnimTredInstruments.SOUNDBANKS) {
						gfgfhh[i] = {};
					}
					var fsd = 0;
					for (var fdssf2 in gfgfhh) {
						GSGSG2.push({
							name: fdssf2,
							index: fsd,
							scoreRender: 0,
							y: 35
						});
						GSGSG.push({
							name: fdssf2,
							index: fsd,
							score: 0,
							scoreRender: 0
						});
						fsd++;
					}
					soundsCount = {
						"My Little Pony": 0,
						"Peppa Pig": 0,
					}
				}
				player.onended = function () {
					if (current_song < songsDatas.length - 1) {
						vassf3[0] = 6;
						vassf3[1] = 0;
					}
				}
				function ghfjgj(c) {
					var d = 0;
					for (var i = 0; i < songsDatas.length; i++) {
						var e = songsDatas[i];
						var j = d;
						d += e.duration;
						if (c == i) {
							return [j, d];
						}
					}
					return null;
				}
				function loadMidiVase(s) {
					var _ = current_song;
					if (s > 0) {
						current_song++;
					} else if (s < 0) {
						current_song--;
						if (current_song < 0) {
							current_song = 0;
						}
					}
					if (current_song >= songsDatas.length) {
						current_song = _;
						return;
					}
					loadMidiSong();
				}
				function loadMidiSong() {
					vassf3[1] = 0.03;
					vassf3[0] = 3;
					reste();
					var gdg = ghfjgj(current_song);
					if (gdg) {
						player.loadMidiFromData(songsDatas[current_song].data);
						vassf4 = gdg[0];
						player.play();
					}
				}
				function nextSong() {
					if (current_song < 0) select_song = -1;
					current_song = select_song;
					loadMidiVase(1);
					select_song = current_song;
				}
				function previousSong() {
					current_song = select_song;
					loadMidiVase(-1);
					select_song = current_song;
				}
				function getDuraction(num) {
					var txt = '';
					if (Math.floor(num) > 3599) {
						txt += '' + Math.floor(num / 3600);
						txt += ':';
						if (mod(Math.floor(num / 60), 60) > 9) {
							txt += '' + mod(Math.floor(num / 60), 60);
						} else {
							txt += '0' + mod(Math.floor(num / 60), 60);
						}
						txt += ':';
						if (mod(Math.floor(num), 60) > 9) {
							txt += '' + mod(Math.floor(num), 60);
						} else {
							txt += '0' + mod(Math.floor(num), 60);
						}
					} else {
						txt += '' + mod(Math.floor(num / 60), 60);
						txt += ':';
						if (mod(Math.floor(num), 60) > 9) {
							txt += '' + mod(Math.floor(num), 60);
						} else {
							txt += '0' + mod(Math.floor(num), 60);
						}
					}
					return txt;
				}
				function getByte(b) {
					if (b >= 1000000) {
						return (Math.floor(b / 100000) / 10) + " MB";
					} else {
						if (b >= 1000) {
							return Math.floor(b / 1000) + " KB";
						} else {
							return b + " B";
						}
					}
				}

				function step() {
					ctx.save();
					ctx.scale(xoom, xoom);
					if (isRunning) {
						ctx.save();
						ctx.globalAlpha = 1;
						ctx.clearRect(0,0,640,360);
						ctx.fillStyle = '#000';
						ctx.fillRect(0,0,640,360);
						var dgdfg5f = 0;
						for (var i9 = 0; i9 < GSGSG.length; i9++) {
							//GSGSG[i9].scoreRender = GSGSG[i9].score;
							GSGSG[i9].scoreRender += (GSGSG[i9].score - GSGSG[i9].scoreRender) / 8;
						}
						for (var i9 = 0; i9 < GSGSG2.length; i9++) {
							var xhre = GSGSG[i9].index;
							if (GSGSG[i9].score > 0) {
								//GSGSG2[xhre].y = i9;
								GSGSG2[xhre].y += ((i9 - GSGSG2[xhre].y) / 6);
							}
							GSGSG2[xhre].scoreRender = GSGSG[i9].scoreRender;
							GSGSG2[xhre].score = GSGSG[i9].score;
						}
						ctx.globalAlpha = 1;
						var oaE = (songsDatas.length * 20) - 358;
						var oafd = (select_song * 20) - 180;
						if (oafd > -46 && select_song >= 8 && songsDatas.length >= 16) {
							if (oafd > oaE) {
								oafd = oaE;
							}
						} else {
							oafd = -46;
						}
						var fgdgdfgdgfd = (oafd - vassf2) / 8;
						vassf2 += fgdgdfgdgfd;
						for (var i8 = 0; i8 < GSGSG2.length; i8++) {
							if (GSGSG2[i8].scoreRender > 0) {
								var nameR = GSGSG2[i8].name;
								nameR += ": " + GSGSG2[i8].score;
								var ox = 12;
								var oy = 54 + (GSGSG2[i8].y * 15);
								var ow = (GSGSG2[i8].scoreRender / GSGSG[0].scoreRender) * 620;
								var oh = 15;
								var gfdd = (GSGSG2[i8].scoreRender * 2) % 360;
								ctx.font = "12px Arial";
								ctx.textAlign = "left";
								ctx.fillStyle = '#fff';
								ctx.fillText(nameR, 12, 65 + (GSGSG2[i8].y * 15));
								ctx.save();
								ctx.beginPath();
								ctx.rect(ox, oy, ow, oh);
								ctx.clip();
								ctx.fillStyle = 'hsl(' + gfdd + ',' + 100 + '%,' + 50 + '%)';
								ctx.fillRect(ox, oy, ow, oh);
								if (gfdd > 35 && gfdd < 210) {
									ctx.fillStyle = '#000';
								} else {
									ctx.fillStyle = '#fff';
								}
								ctx.font = "12px Arial";
								ctx.textAlign = "left";
								ctx.fillText(nameR, 12, 65 + (GSGSG2[i8].y * 15));
								ctx.restore();
								dgdfg5f++;
							}
						}
						ctx.textAlign = "left";
						ctx.font = "16px Arial";
						ctx.fillStyle = '#fff';
						ctx.fillText((songsDatas[current_song] && songsDatas[current_song].name) || "", 12, 43);
						ctx.fillStyle = '#fff';
						ctx.font = "16px Arial";
						ctx.textAlign = "center";
						if (player.isPaused) {
							ctx.fillText("Paused", 320, 340);
						} else {
							var countMLP = soundsCount["My Little Pony"];
							var countPP = soundsCount["Peppa Pig"];
							if (countMLP > 0 || countPP > 0) {
								var sdfddddd = "Sounds: ";
								if (countMLP > 0) 
									sdfddddd += "My Little Pony";
								if (countPP > 0) {
									if (countMLP > 0) sdfddddd += " & ";
									sdfddddd += "Peppa Pig";
								}
								ctx.fillText(sdfddddd, 320, 340);
							}	
						}
						if (!selSa) {
							ctx.globalAlpha = 0.8;
							ctx.fillStyle = '#000';
							ctx.fillRect(0,0,640,360);
							ctx.globalAlpha = 1;
							for (var ig6 = 0; ig6 < songsDatas.length; ig6++) {
								var sfsd = songsDatas[ig6];
								if (ig6 == select_song) {
									ctx.fillStyle = '#fff';
									ctx.font = "16px Arial";
								} else {
									ctx.font = "12px Arial";
									if (ig6 == current_song) {
										ctx.fillStyle = '#00f';
									} else {
										ctx.fillStyle = '#0f0';
									}
								}
								var fdgfd = ((ig6 * 20) - vassf2);
								ctx.textAlign = "left";
								ctx.fillText(sfsd.name + " (" + getByte(sfsd.size) + ")" + ((ig6 == current_song) ? " [Playing]" : ""), 10, fdgfd);
							}
						}
						ctx.globalAlpha = 1;
						if (vassf3[0] == 6) {
							vassf3[1] += 0.03;
							if (vassf3[1] > 1) 
								vassf3[0] = 2;
						}
						if (vassf3[0] == 2) 
							loadMidiVase(1);
						if (vassf3[0] == 3) {
							vassf3[1] += 0.03;
							vassf3[0] = 4;
						}
						ctx.fillStyle = '#000';
						ctx.fillRect(0, 0, 640, 26);
						ctx.fillStyle = '#fff';
						ctx.font = "16px Arial";
						ctx.textAlign = "left";
						ctx.fillText(getDuraction(vassf4 + player.currentTime) + "/" + getDuraction(Math.ceil(vassf5)) + " song "+ (current_song + 1) +"/"+songsDatas.length + " " + getDuraction(player.currentTime) + "/" + getDuraction(Math.ceil(player.duration)), 6, 18);
						ctx.textAlign = "right";
						ctx.fillStyle = '#fff';
						ctx.fillText("YTPMV Cartoon Midi " + AnimTredInstruments.version, 640 - 6, 18);
						ctx.fillStyle = '#ddd';
						ctx.globalAlpha = 1;
						ctx.fillRect(0, 350, 640, 10);
						var dgdfg3f = 0;
						for (var i6 = 0; i6 < songsDatas.length; i6++) {
							var fdgdfgdfg2 = dgdfg3f / vassf5;
							if (((vassf4 + player.currentTime) >= dgdfg3f) && ((vassf4 + player.currentTime) <= (dgdfg3f + songsDatas[i6].duration))) {
								ctx.fillStyle = '#ff0';
							} else {
								if ((i6 == select_song) && !selSa) {
									ctx.fillStyle = '#f00';
								} else {
									if (i6 % 2) {
										ctx.fillStyle = '#639';
									} else {
										ctx.fillStyle = '#282';
									}	
								}
							}
							ctx.fillRect(fdgdfgdfg2 * 640, 350, (songsDatas[i6].duration / vassf5) * 640, 10);
							dgdfg3f += songsDatas[i6].duration;
						}
						var fdgdfgdfg = (vassf4 + player.currentTime) / vassf5;
						ctx.strokeStyle = '#f00';
						ctx.beginPath();
						ctx.lineWidth = 2;
						ctx.moveTo(fdgdfgdfg * 640, 350);
						ctx.lineTo(fdgdfgdfg * 640, 360);
						ctx.stroke();
						ctx.restore();
					} else {
						ctx.globalAlpha = 1;
						ctx.clearRect(0,0,640,360);
						ctx.fillStyle = '#000';
						ctx.fillRect(0,0,640,360);
						ctx.fillStyle = '#fff';
						ctx.font = "16px Arial";
						ctx.textAlign = "center";
						ctx.fillText(ggdf_loaded, 320, 120);
					}
					ctx.restore();
				}

				function startMain() {
					isRunning = true;
				}

				setInterval(step, 1000 / 60);

				var mod = function (x, y) {
					var r = x % y;
					if (r / y < 0) {
						r += y;
					}
					return r;
				};
				vcbb.addEventListener('input', function() {
					xoom = vcbb.value;
					resizess();
				}, false);
				function allCallbackLoader(prs, funend) {
					var count = prs.length;
					if (count == 0) funend();
					else {
						var idx = 0;
						var fend = function() {
							prs[idx++](function() {
								count--;
								if (count == 0) {
									funend();
								} else {
									fend();
								}
							});
						}
						fend();
					}
				}
				function playPause() {
					if (player.isPaused) {
						player.play();
					} else {
						player.pause();
					}
				}
				var loaderState = 0;
				var dfdfdfdfdf = [];
				var loadedd = 0;
				function readBlob(file, callback) {
					return function(fg) {
						var r = new FileReader();
						r.onload = function(params) {
							callback(r.result, file.name, fg);
						}
						r.readAsArrayBuffer(file);
					}
				}
				loadmidifile.onclick = function () {
					var sa = document.createElement('input');
					sa.type = 'file';
					sa.accept = '.mid, .rmi, .midi';
					sa.multiple = true;
					sa.addEventListener('change', function (e) {
						dfdfdfdfdf = [];
						loadedd = 0;
						vassf5 = 0;
						loaderState = 0;
						songsDatas = [];
						isRunning = false;
						ggdf_loaded = "";
						reset();
						var dfg = [];
						var promise32 = 0;
						for (var i = 0; i < e.target.files.length; i++) {
							var file = e.target.files[i];
							dfg.push(file);
						}
						var promises = [];
						for (var i = 0; i < dfg.length; i++) {
							promises.push(readBlob(dfg[i], function(e, t, g) {
								dfdfdfdfdf.push({
									name: t,
									data: e
								});
								ggdf_loaded = "decode arrayBuffer " + promise32 + "/" + dfg.length;
								promise32++;
								g();
							}));
						}
						allCallbackLoader(promises, loadSongs);
					}, false);
					sa.click();
				}
				function loadSongs() {
					player.onload = function() {
						var gdfgfdg = player.toJSON();
						gdfgfdg.duration *= 1000000;
						vassf5 += (gdfgfdg.duration / 1000000);
						songsDatas.push({
							name: dfdfdfdfdf[loadedd].name,
							size: dfdfdfdfdf[loadedd].data.byteLength,
							duration: (gdfgfdg.duration / 1000000),
							data: gdfgfdg
						});
						loaderState = 2;
						setTimeout(gghgh, 10);
					}
					player.onerror = function(e) {
						console.log("cannot read midi " + dfdfdfdfdf[loadedd].name + "", e);
						loaderState = 2;
						setTimeout(gghgh, 10);
					}
					setTimeout(gghgh, 10);
				}
				document.addEventListener("keydown", function(e){
					if (isRunning) {
						var key = String.fromCharCode(e.keyCode).toLowerCase();
						if (key == "q") {
							selSa = !selSa;
						}
						if (key == " ") {
							current_song = select_song;
							loadMidiSong();
						}
						if (key == "p") {
							playPause();
						}
						if (e.keyCode == 39) {
							nextSong();
						}
						if (e.keyCode == 37) {
							previousSong();
						}
						if (e.keyCode == 38) {
							select_song--;
							if (select_song < 0) select_song = 0;
						}
						if (e.keyCode == 40) {
							select_song++;
							if (select_song >= songsDatas.length - 1) select_song = songsDatas.length - 1;
						}
					}
				});
				midiplaylishshowhide.onclick = function() {
					if (isRunning) {
						selSa = !selSa;
					}
				}
				midisongnext.onclick = function() {
					if (isRunning) {
						nextSong();
					}
				}
				midisongprev.onclick = function() {
					if (isRunning) {
						previousSong();
					}
				}
				midiplaypause.onclick = function() {
					playPause();
				}
				player.onprogress = function(a) {
					ggdf_loaded = "loading " + Math.floor((loadedd / dfdfdfdfdf.length) * 100) + "% : " + a;
				};
				function gghgh() {
					if (loaderState == 0) {
						player.loadMid(dfdfdfdfdf[loadedd].data);
					} else if (loaderState == 2) {
						loadedd++;
						if (loadedd == dfdfdfdfdf.length) {
							ggdf_loaded = "";
							player.onload = null;
							player.onerror = null;
							player.loadSoundbank(function(e) {
								player.cleanup();
								ggdf_loaded = "";
								startMain();
							});
						} else {
							loaderState = 0;
							setTimeout(gghgh, 10);
						}
					}
				}	
				resizess();
			}());
		</script>
	</body>
</html>
